# Pipeline to build and publish the exim image (linux/amd64 + linux/arm64) to
# DockerHub. Triggered manually, on weekly schedule, or by the common
# change-detection pipeline.
#
# The build logic now lives in the shared build-image.yml workflow so the agreed
# Docker tag strategy is defined in exactly one place; this file only supplies
# the service-specific inputs and triggers.
name: Build and Publish Exim

on:
  # Manual trigger
  workflow_dispatch:
  
  # Weekly schedule - runs every Sunday at 00:00 UTC
  schedule:
    - cron: '0 0 * * 0'
  
  # Allow triggering from other workflows
  workflow_call:

jobs:
  build-and-publish:
    uses: ./.github/workflows/build-image.yml
    with:
      service: exim
    secrets: inherit
