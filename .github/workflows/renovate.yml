# Standalone (self-hosted) Renovate bot run.
# Requested to keep the now-pinned Alpine base images and GitHub Actions
# versions up to date automatically: pinning removed the implicit `latest`
# drift, so an automated updater is needed to replace it. This workflow's cron
# is the single source of truth for run timing (renovate.json intentionally has
# no `schedule`); renovate.json only holds the automerge policy.
name: Renovate

on:
  # Manual trigger for on-demand dependency runs
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug

  # Weekly schedule - runs every Friday at 03:00 UTC
  schedule:
    - cron: '0 3 * * 5'

# Renovate pushes branches and opens PRs with the built-in GITHUB_TOKEN, so the
# job needs write scopes.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v43.0.19
        env:
          # Restrict the run to this repository only
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # Automerge is enabled in renovate.json; platform automerge lets
          # GitHub merge the PR once required checks pass.
          RENOVATE_PLATFORM_AUTOMERGE: 'true'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
        with:
          # The earlier run failed with "'token' MUST be passed using its input
          # or the 'RENOVATE_TOKEN' environment variable" because it referenced
          # an unset RENOVATE_TOKEN secret. This repository always uses the
          # built-in GITHUB_TOKEN instead. Two consequences to be aware of:
          # PRs it opens do not trigger other workflows (so automerge cannot
          # wait on CI), and it cannot push changes to files under
          # .github/workflows (Actions version bumps must be merged by hand).
          token: ${{ github.token }}

      - name: Add run summary
        if: always()
        run: |
          echo "## Renovate Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Result:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
