services:
  # docker compose up --build -d
  devbox:
    build:
      context: .
    ports:
      - "${SSH_PORT:-2222}:2222"
    volumes:
      - type: bind
        source: ${AUTHORIZED_KEYS_FILE:-./secrets/authorized_keys}
        target: /etc/devbox/authorized_keys
        read_only: true
      # The whole home directory persists: CLI logins and config (~/.aws,
      # ~/.azure, ~/.oci, ~/.claude), terraform plugins, work in progress and
      # the generated SSH host keys. A named volume starts out owned by the
      # account because Docker seeds it from the image.
      - type: volume
        source: home
        target: /home/user
    # Nothing in the image needs root or a capability, so none are kept.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      start_period: 30s
    # Chromium and Firefox exhaust the default 64 MiB of shared memory.
    shm_size: 1gb
    restart: unless-stopped

volumes:
  home:
