// Tor reaches its relays through the container's proxy with HTTP CONNECT, which
// works only if that proxy allows tunnels to relay ports such as 443 and 9001.
if (httpsProxy) {
  defaultPref("torbrowser.settings.proxy.enabled", true);
  defaultPref("torbrowser.settings.proxy.type", 2);
  defaultPref("torbrowser.settings.proxy.address", httpsProxy.host);
  defaultPref("torbrowser.settings.proxy.port", httpsProxy.port);
}
