// defaultPref keeps a choice made in the desktop session across restarts.
defaultPref("media.autoplay.default", 5);
defaultPref("media.autoplay.blocking_policy", 2);
defaultPref("media.av1.enabled", false);
defaultPref("layout.frame_rate", 30);
defaultPref("general.smoothScroll", false);
defaultPref("toolkit.cosmeticAnimations.enabled", false);
defaultPref("ui.prefersReducedMotion", 1);
defaultPref("image.animation_mode", "once");
defaultPref("dom.ipc.processCount", 4);
defaultPref("dom.ipc.processCount.webIsolated", 1);
defaultPref("browser.tabs.unloadOnLowMemory", true);
defaultPref("browser.sessionstore.interval", 60000);
defaultPref("browser.newtabpage.activity-stream.feeds.topsites", false);
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
defaultPref("extensions.pocket.enabled", false);
defaultPref("network.trr.mode", 5);
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("datareporting.policy.firstRunURL", "");
// No GPU reaches the container, and captchas reject a browser without WebGL.
defaultPref("webgl.forbid-software", false);
defaultPref("webgl.force-enabled", true);

if (httpProxy || httpsProxy || socksProxy) {
  defaultPref("network.proxy.type", 1);
  if (socksProxy) {
    defaultPref("network.proxy.socks", socksProxy.host);
    defaultPref("network.proxy.socks_port", socksProxy.port);
    defaultPref("network.proxy.socks_version", 5);
    defaultPref("network.proxy.socks5_remote_dns", true);
  }
  if (httpProxy) {
    defaultPref("network.proxy.http", httpProxy.host);
    defaultPref("network.proxy.http_port", httpProxy.port);
  }
  if (httpsProxy) {
    defaultPref("network.proxy.ssl", httpsProxy.host);
    defaultPref("network.proxy.ssl_port", httpsProxy.port);
  }
  var noProxy = getenv("no_proxy") || getenv("NO_PROXY");
  if (noProxy) defaultPref("network.proxy.no_proxies_on", noProxy);
}
