services:
  # SSH and RDP run side by side: docker compose up --build -d
  sandbox:
    build:
      context: .
    environment:
      # Omit to leave the account locked, which makes the RDP listener unusable.
      XRDP_PASSWORD: ${XRDP_PASSWORD:-}
    ports:
      - "${SSH_PORT:-2222}:2222"
      # Bound to loopback because RDP must not be published broadly.
      - "127.0.0.1:${RDP_PORT:-3389}:3389"
    volumes:
      - type: bind
        source: ${AUTHORIZED_KEYS_FILE:-./secrets/authorized_keys}
        target: /home/user/.ssh/authorized_keys
        read_only: true
      - type: bind
        source: ${WORKSPACE_DIR:-./workspace}
        target: /home/user/workspace
    # The container runs as UID 10000; a bind mount keeps its host ownership,
    # so chown the workspace directory to 10000 or the session cannot write to it.
    init: true
    shm_size: 1gb
    restart: unless-stopped
